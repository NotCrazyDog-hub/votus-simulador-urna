<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Configuração para celular / iPhone -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#f7f0dc">

    <title>VOTUS - Teclado Mobile</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;

            background: #f7f0dc;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(18px, env(safe-area-inset-top))
                max(14px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(14px, env(safe-area-inset-left));

            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }


        /* ==========================================
           TECLADO
        ========================================== */

        .teclado {
            width: min(100%, 365px);

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr))
                0.95fr;

            grid-template-rows:
                repeat(4, 58px);

            gap: 10px;
        }


        /* ==========================================
           TODOS OS BOTÕES
        ========================================== */

        button {
            border: 0;

            margin: 0;
            padding: 0;

            border-radius: 7px;

            color: #ffffff;

            font-family:
                "Arial Narrow",
                Arial,
                sans-serif;

            font-weight: 700;

            cursor: pointer;

            user-select: none;

            touch-action: manipulation;

            -webkit-user-select: none;

            transition:
                transform 70ms ease,
                filter 70ms ease;
        }


        /* Efeito ao tocar */

        button:active {
            transform: scale(0.94);

            filter: brightness(0.90);
        }


        /* ==========================================
           NÚMEROS
        ========================================== */

        .numero {
            background: #ff7900;

            font-size: 28px;

            font-weight: 400;
        }


        /* ==========================================
           BOTÕES DE AÇÃO
        ========================================== */

        .acao {
            font-size: 12px;

            line-height: 1.05;

            letter-spacing: -0.2px;
        }


        /* ==========================================
           BRANCO
        ========================================== */

        .branco {
            grid-column: 4;

            grid-row: 1;

            background: #f5b900;
        }


        /* ==========================================
           CORRIGE
        ========================================== */

        .corrige {
            grid-column: 4;

            grid-row: 2;

            background: #a80d08;
        }


        /* ==========================================
           CONFIRMA
        ========================================== */

        .confirma {
            grid-column: 4;

            grid-row: 3 / span 2;

            background: #17643c;

            font-size: 13px;
        }


        /* ==========================================
           POSIÇÃO DOS NÚMEROS
        ========================================== */

        .n1 {
            grid-column: 1;
            grid-row: 1;
        }

        .n2 {
            grid-column: 2;
            grid-row: 1;
        }

        .n3 {
            grid-column: 3;
            grid-row: 1;
        }


        .n4 {
            grid-column: 1;
            grid-row: 2;
        }

        .n5 {
            grid-column: 2;
            grid-row: 2;
        }

        .n6 {
            grid-column: 3;
            grid-row: 2;
        }


        .n7 {
            grid-column: 1;
            grid-row: 3;
        }

        .n8 {
            grid-column: 2;
            grid-row: 3;
        }

        .n9 {
            grid-column: 3;
            grid-row: 3;
        }


        .n0 {
            grid-column: 2;
            grid-row: 4;
        }


        /* ==========================================
           TELAS MENORES
        ========================================== */

        @media (max-width: 360px) {

            .teclado {
                gap: 8px;

                grid-template-rows:
                    repeat(4, 54px);
            }


            .numero {
                font-size: 25px;
            }


            .acao {
                font-size: 10px;
            }


            .confirma {
                font-size: 11px;
            }
        }


        /* ==========================================
           BOTÃO TELA CHEIA
        ========================================== */

        #btnTelaCheia {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            right: max(10px, env(safe-area-inset-right));
            z-index: 9999;

            width: auto;
            min-width: 110px;
            height: 42px;
            padding: 0 12px;

            background: #17643c;
            color: #ffffff;
            border-radius: 8px;

            font-size: 12px;
            font-weight: 700;

            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }

        #btnTelaCheia.hidden {
            display: none;
        }

        /* No modo tela cheia, mantém o teclado centralizado */
        :fullscreen body {
            min-height: 100dvh;
        }

        @media (max-width: 360px) {
            #btnTelaCheia {
                min-width: 96px;
                height: 38px;
                font-size: 11px;
                padding: 0 9px;
            }
        }

    </style>
</head>



<body>

    <!-- BOTÃO PARA ATIVAR TELA CHEIA NO CELULAR/TABLET -->
    <button
        id="btnTelaCheia"
        type="button"
        aria-label="Ativar tela cheia"
        onclick="ativarTelaCheia()"
    >
        ⛶ TELA CHEIA
    </button>



    <!-- ==========================================
         TECLADO
    ========================================== -->

    <main
        class="teclado"
        aria-label="Teclado da urna VOTUS"
    >


        <!-- LINHA 1 -->

        <button
            class="numero n1"
            data-numero="1"
        >
            1
        </button>


        <button
            class="numero n2"
            data-numero="2"
        >
            2
        </button>


        <button
            class="numero n3"
            data-numero="3"
        >
            3
        </button>


        <button
            class="acao branco"
            data-acao="branco"
        >
            BRANCO
        </button>



        <!-- LINHA 2 -->

        <button
            class="numero n4"
            data-numero="4"
        >
            4
        </button>


        <button
            class="numero n5"
            data-numero="5"
        >
            5
        </button>


        <button
            class="numero n6"
            data-numero="6"
        >
            6
        </button>


        <button
            class="acao corrige"
            data-acao="corrige"
        >
            CORRIGE
        </button>



        <!-- LINHA 3 -->

        <button
            class="numero n7"
            data-numero="7"
        >
            7
        </button>


        <button
            class="numero n8"
            data-numero="8"
        >
            8
        </button>


        <button
            class="numero n9"
            data-numero="9"
        >
            9
        </button>


        <button
            class="acao confirma"
            data-acao="confirma"
        >
            CONFIRMA
        </button>



        <!-- LINHA 4 -->

        <button
            class="numero n0"
            data-numero="0"
        >
            0
        </button>


    </main>



    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        /*
         * Envia o comando para o simulador.
         *
         * IMPORTANTE:
         * O index.html precisará escutar esse localStorage
         * para receber os comandos.
         */
        const protocolo = location.protocol === "https:" ? "wss:" : "ws:";

        const socket = new WebSocket(
            `${protocolo}//${location.host}`
        );

        socket.addEventListener("open", () => {
            console.log("Teclado conectado à urna.");
        });

        socket.addEventListener("close", () => {
            console.log("Conexão com a urna encerrada.");
        });

        function enviarComando(comando) {
            if (socket.readyState !== WebSocket.OPEN) {
                console.log("Teclado ainda não conectado.");
                return;
            }

            socket.send(
                JSON.stringify({
                    comando: comando
                })
            );
        }



        /* ==========================================
           BOTÕES NUMÉRICOS
        ========================================== */

        document
            .querySelectorAll("[data-numero]")
            .forEach(botao => {

                botao.addEventListener(
                    "click",
                    () => {

                        enviarComando({

                            tipo: "numero",

                            valor:
                                botao.dataset.numero

                        });

                    }
                );

            });



        /* ==========================================
           BOTÃO BRANCO
        ========================================== */

        document
            .querySelector(
                "[data-acao='branco']"
            )
            .addEventListener(
                "click",
                () => {

                    enviarComando({

                        tipo: "acao",

                        valor: "branco"

                    });

                }
            );



        /* ==========================================
           BOTÃO CORRIGE
        ========================================== */

        document
            .querySelector(
                "[data-acao='corrige']"
            )
            .addEventListener(
                "click",
                () => {

                    enviarComando({

                        tipo: "acao",

                        valor: "corrige"

                    });

                }
            );



        /* ==========================================
           BOTÃO CONFIRMA
        ========================================== */

        document
            .querySelector(
                "[data-acao='confirma']"
            )
            .addEventListener(
                "click",
                () => {

                    enviarComando({

                        tipo: "acao",

                        valor: "confirma"

                    });

                }
            );


        /* ==========================================
           TELA CHEIA — CELULAR / TABLET
        ========================================== */

        const btnTelaCheia = document.getElementById("btnTelaCheia");

        function estaEmTelaCheia() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement
            );
        }

        function atualizarBotaoTelaCheia() {
            if (!btnTelaCheia) return;

            if (estaEmTelaCheia()) {
                btnTelaCheia.classList.add("hidden");
            } else {
                btnTelaCheia.classList.remove("hidden");
            }
        }

        async function ativarTelaCheia() {
            const elemento = document.documentElement;

            try {
                if (document.fullscreenElement) {
                    return;
                }

                if (elemento.requestFullscreen) {
                    await elemento.requestFullscreen();
                } else if (elemento.webkitRequestFullscreen) {
                    elemento.webkitRequestFullscreen();
                } else if (elemento.msRequestFullscreen) {
                    elemento.msRequestFullscreen();
                } else {
                    alert(
                        "Este navegador não oferece suporte à tela cheia. " +
                        "No celular, tente abrir o site pelo navegador em modo de tela cheia."
                    );
                    return;
                }

                atualizarBotaoTelaCheia();
            } catch (erro) {
                console.log("Não foi possível ativar a tela cheia:", erro);
            }
        }

        document.addEventListener(
            "fullscreenchange",
            atualizarBotaoTelaCheia
        );

        document.addEventListener(
            "webkitfullscreenchange",
            atualizarBotaoTelaCheia
        );

        document.addEventListener(
            "MSFullscreenChange",
            atualizarBotaoTelaCheia
        );

        atualizarBotaoTelaCheia();

    </script>

</body>

</html>
