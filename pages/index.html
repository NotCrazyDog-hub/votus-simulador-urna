<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap"

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>VOTUS - Visor da Urna</title>

    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        #visor {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .numero-input {
            flex-shrink: 0;
        }

        @media (orientation: portrait) {

            body::before {
                content: "Gire o tablet para a posição horizontal";

                position: fixed;
                inset: 0;
                z-index: 9999;

                display: flex;
                align-items: center;
                justify-content: center;

                background: #efe8d2;
                color: #1b623a;

                font-family: Inter, sans-serif;

                font-weight: 800;

                text-align: center;
                padding: 30px;
            }

            #visor,
            audio {
                visibility: hidden;
            }
        }

    </style>
</head>


<body class="bg-[#efe8d2] font-['Inter']">

    <!-- =====================================================

    ====================================================== -->

    <main

        <!-- =================================================

        ================================================== -->

        <div
            class="

                max-w-none
                bg-[#f7f2df]
                rounded-xl
                md:rounded-2xl
                px-6
                py-4
                md:px-8
                md:py-5
                shadow-[0_15px_40px_-15px_rgba(0,0,0,0.35)]
                overflow-hidden
            "
        >


            <!-- =============================================
                 TELA FINAL
            ============================================== -->

            <div

                    inset-0

            </div>


            <!-- =============================================
                 CABEÇALHO
            ============================================== -->

            <div

                    relative

                    flex

                    gap-4
                "
            >

                <img
                    src="../assets/images/Votus logo.png"
                    alt="VOTUS"
                    class="w-16 md:w-20 flex-shrink-0"
                >

                <div
                    class="
                        font-['Archivo_Black']
                        text-[#e3a99a]
                        text-[10px]
                        md:text-xs
                        uppercase
                        tracking-[0.25em]
                        text-right
                    "
                >
                    Ilustrativo
                </div>

            </div>


            <!-- =============================================
                 CONTEÚDO
            ============================================== -->

            <div
                class="
                    relative
                    z-10

                    >


                    <!-- MOLDURA -->

                    <div

                    >

                        <img
                            src="../assets/images/Moldura.png"

                        <div

                    </div>


                    <img

                            w-[80%]

                        "

            <!-- =============================================
                 MENSAGEM
            ============================================== -->

            <div

                    justify-center

                    border-2

                    text-center

                    lg:text-lg

                Digite o número
            </div>


            <!-- =============================================

            ============================================== -->

            <div
                class="
                    absolute
                    bottom-3
                    left-5
                    right-5
                    md:left-8
                    md:right-8
                    flex

                    justify-between

                "
            >

                <div
                    class="
                        font-['Archivo_Black']
                        text-[#e3a99a]
                        text-[10px]
                        md:text-xs
                        uppercase
                        tracking-[0.25em]

                >
                    Ilustrativo
                </div>


                <img

    </main>


    <!-- =====================================================

    <audio id="somConfirmacao" preload="auto">

        <source

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        // =====================================================
        // CHAPA 1
        // =====================================================

        const chapa1 = [

            {
                nome: "Russas",
                cargo: "Deputada(o) Federal",
                Partido: "edudantil",
                numero: "1234",
                foto: "Oliveira.png"
            },

            {
                nome: "Limoeiro do Norte",

                Partido: "edudantil",
                numero: "31456",
                foto: "Gustavo.png"
            },

            {
                nome: "Jaguaribe",
                cargo: "Senadora(or) - 1ª vaga",
                Partido: "edudantil",
                numero: "278",
                foto: "Dafny.png"
            },

            {
                nome: "Quixeré",
                cargo: "Senadora(or) - 2ª vaga",
                Partido: "edudantil",
                numero: "691",
                foto: "Arielly.png"
            },

            {
                nome: "Morada Nova",
                cargo: "Governadora(or)",
                Partido: "edudantil",
                numero: "37",
                foto: "Kerllon_Sousa.png"
            },

            {
                nome: "Tabuleiro do Norte",
                cargo: "Presidente da República",
                Partido: "edudantil",
                numero: "21",
                foto: "Eva.png"
            }

        ];


        // =====================================================
        // CHAPA 2
        // =====================================================

        const chapa2 = {

            numero: 2,

            nome: "LITORAL LESTE",

            candidatos: [

                {
                    nome: "Aracati",
                    cargo: "Deputada(o) Federal",
                    Partido: "docente",
                    numero: "5678",
                foto: "Elenir.png"
                },

                {
                    nome: "Beberibe",
                    cargo: "Deputada(o) Estadual",
                    Partido: "docente",
                    numero: "67891",
                foto: "Rosangela.png"
                },

                {
                    nome: "Cascavel",
                    cargo: "Senadora(or) - 1ª vaga",
                    Partido: "docente",
                    numero: "542",
                foto: "Israely.png"
                },

                {
                    nome: "Fortim",
                    cargo: "Senadora(or) - 2ª vaga",
                    Partido: "docente",
                    numero: "783",
                foto: "Silvania.png"
                },

                {
                    nome: "Icapuí",
                    cargo: "Governadora(or)",
                    Partido: "docente",
                    numero: "56",
                foto: "Natan.png"
                },

                {
                    nome: "Pindoretama",
                    cargo: "Presidente da República",
                    Partido: "docente",
                    numero: "18",
                foto: "Rusilania.png"
                }

            ]

        };


        // =====================================================
        // CANDIDATOS
        // =====================================================

        const candidatos = [
            ...chapa1,
            ...chapa2.candidatos
        ];


        // =====================================================
        // CARGOS
        // =====================================================

        const cargos = [

            "Deputada(o) Federal",

            "Deputada(o) Estadual",

            "Senadora(or) - 1ª vaga",

            "Senadora(or) - 2ª vaga",

            "Governadora(or)",

            "Presidente da República"

        ];


        // =====================================================
        // ELEMENTOS
        // =====================================================

        const elementoCargo =
            document.getElementById("cargo");

        const elementoInstrucao =
            document.getElementById("instrucao");

        const elementoNumero =
            document.getElementById("numero");

        const elementoMensagem =
            document.getElementById("mensagem");

        const nomeCandidato =
            document.getElementById("nomeCandidato");

        const partidoCandidato =
            document.getElementById("partidoCandidato");

        const fotoCandidato =
            document.getElementById("fotoCandidato");

        const fotoPlaceholder =
            document.getElementById("fotoPlaceholder");

        const somConfirmacao =
            document.getElementById("somConfirmacao");

        const somFinal =
            document.getElementById("somFinal");

        const telaFinal =
            document.getElementById("telaFinal");


        // =====================================================
        // TELA CHEIA
        // =====================================================
        function ativarTelaCheia() {
            const elemento = document.documentElement;

            try {
                if (elemento.requestFullscreen) {
                    elemento.requestFullscreen();
                } else if (elemento.webkitRequestFullscreen) {
                    elemento.webkitRequestFullscreen();
                } else if (elemento.msRequestFullscreen) {
                    elemento.msRequestFullscreen();
                }
            } catch (erro) {
                console.log("Não foi possível ativar a tela cheia:", erro);
            }
        }

        function atualizarBotaoTelaCheia() {
            const botao = document.getElementById("btnTelaCheia");

            if (!botao) {
                return;
            }

            const emTelaCheia =
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement;

            if (emTelaCheia) {
                botao.classList.add("hidden");
            } else {
                botao.classList.remove("hidden");
            }
        }

        document.addEventListener("fullscreenchange", atualizarBotaoTelaCheia);
        document.addEventListener("webkitfullscreenchange", atualizarBotaoTelaCheia);
        document.addEventListener("MSFullscreenChange", atualizarBotaoTelaCheia);


        // =====================================================
        // ESTADO
        // =====================================================

        let cargoAtual = 0;

        let votoAtual = "";

        let votoConfirmado = false;

        let votacaoFinalizada = false;


        // =====================================================
        // CLASSE DOS NÚMEROS
        // =====================================================

        const CLASSE_INPUT_NUMERO =
            "numero-input font-['Space_Mono'] w-11 h-14 md:w-14 md:h-16 lg:w-16 lg:h-20 border-2 border-[#1b623a] rounded-md text-2xl md:text-3xl lg:text-4xl font-bold text-center text-[#1b623a] bg-transparent flex items-center justify-center select-none";


        // =====================================================
        // CANDIDATOS DO CARGO
        // =====================================================

        function getCandidatosDoCargo() {

            const cargo =
                cargos[cargoAtual];

            return candidatos.filter(
                candidato =>
                    candidato.cargo === cargo
            );

        }


        // =====================================================
        // QUANTIDADE DE DÍGITOS
        // =====================================================

        function getQuantidadeDigitos() {

            const cargo =
                cargos[cargoAtual];


            // FEDERAL = 4 DÍGITOS
            if (
                cargo === "Deputada(o) Federal"
            ) {

                return 4;

            }


            // ESTADUAL = 5 DÍGITOS
            if (
                cargo === "Deputada(o) Estadual"
            ) {

                return 5;

            }


            // SENADORES = 3 DÍGITOS
            if (
                cargo === "Senadora(or) - 1ª vaga" ||
                cargo === "Senadora(or) - 2ª vaga"
            ) {

                return 3;

            }


            // GOVERNADORA = 2 DÍGITOS
            if (
                cargo === "Governadora(or)"
            ) {

                return 2;

            }


            // PRESIDENTE = 2 DÍGITOS
            if (
                cargo === "Presidente da República"
            ) {

                return 2;

            }


            return 0;

        }


        // =====================================================
        // CRIAR QUADRINHOS
        // =====================================================

        function criarInputs() {

            elementoNumero.innerHTML = "";

            votoAtual = "";

            votoConfirmado = false;


            const quantidade =
                getQuantidadeDigitos();


            for (
                let i = 0;
                i < quantidade;
                i++
            ) {

                const caixa =
                    document.createElement("div");


                caixa.className =
                    CLASSE_INPUT_NUMERO;


                caixa.dataset.valor = "";


                elementoNumero.appendChild(
                    caixa
                );

            }

        }


        // =====================================================
        // ADICIONAR NÚMERO
        // =====================================================

        function adicionarNumeroRemoto(valor) {

            if (
                votacaoFinalizada ||
                votoConfirmado
            ) {

                return;

            }


            const inputs =
                elementoNumero.querySelectorAll(
                    ".numero-input"
                );


            let inputLivre = null;


            for (
                const input of inputs
            ) {

                if (
                    input.dataset.valor === ""
                ) {

                    inputLivre = input;

                    break;

                }

            }


            if (!inputLivre) {

                return;

            }


            inputLivre.dataset.valor =
                String(valor);


            inputLivre.textContent =
                String(valor);


            inputLivre.classList.add(
                "bg-[#eaf6ee]"
            );


            atualizarVoto();


            // Quando preencher todos os quadrinhos
            if (
                votoAtual.length ===
                getQuantidadeDigitos()
            ) {

                verificarNumero();

            }

        }


        // =====================================================
        // ATUALIZAR VOTO
        // =====================================================

        function atualizarVoto() {

            const inputs =
                elementoNumero.querySelectorAll(
                    ".numero-input"
                );


            votoAtual = "";


            inputs.forEach(
                input => {

                    votoAtual +=
                        input.dataset.valor || "";

                }
            );

        }


        // =====================================================
        // ENCONTRAR CANDIDATO
        // =====================================================

        function encontrarCandidato() {

            const candidatosCargo =
                getCandidatosDoCargo();


            let numeroDigitado =
                String(votoAtual);


            const cargo =
                cargos[cargoAtual];


            /*
                Federal possui 4 casas na urna.

                Os candidatos continuam cadastrados
                como "25" e "45".

                Portanto:

                0025 → 25
                0045 → 45
            */

            if (
                cargo === "Deputada(o) Federal"
            ) {

                numeroDigitado =
                    numeroDigitado.replace(
                        /^0+/,
                        ""
                    );

            }


            return candidatosCargo.find(
                candidato => {

                    return String(
                        candidato.numero
                    ) === numeroDigitado;

                }
            );

        }


        // =====================================================
        // VERIFICAR NÚMERO
        // =====================================================

        function verificarNumero() {

            atualizarVoto();


            const quantidade =
                getQuantidadeDigitos();


            if (
                votoAtual.length !==
                quantidade
            ) {

                return;

            }


            const candidato =
                encontrarCandidato();


            if (candidato) {

                mostrarCandidato(
                    candidato
                );

            } else {

                mostrarNumeroInvalido();

            }

        }


        // =====================================================
        // MOSTRAR CANDIDATO
        // =====================================================

        function mostrarCandidato(candidato) {

            nomeCandidato.innerText =
                candidato.nome.trim();


            partidoCandidato.innerText =
                candidato.Partido;


            mostrarFoto(
                candidato
            );


            definirMensagem(
                "Confira os dados e pressione CONFIRMA para confirmar."
            );

        }


        // =====================================================
        // MOSTRAR FOTO
        // =====================================================

        function mostrarFoto(candidato) {

            const nomeArquivo = candidato.foto
                ? candidato.foto
                : removerAcentos(candidato.nome.trim()) + ".png";

            const caminhoFoto =
                "../assets/images/" + encodeURIComponent(nomeArquivo);

            fotoCandidato.onerror = () => {
                esconderFoto();
            };

            fotoCandidato.onload = () => {
                fotoCandidato.classList.remove("hidden");
                fotoPlaceholder.classList.add("hidden");
            };

            fotoCandidato.src = caminhoFoto;
        };




        // =====================================================
        // ESCONDER FOTO
        // =====================================================

        function esconderFoto() {

            fotoCandidato.classList.add(
                "hidden"
            );


            fotoCandidato.removeAttribute(
                "src"
            );


            fotoPlaceholder.classList.remove(
                "hidden"
            );

        }


        // =====================================================
        // REMOVER ACENTOS
        // =====================================================

        function removerAcentos(texto) {

            return texto
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                );

        }


        // =====================================================
        // NÚMERO INVÁLIDO
        // =====================================================

        function mostrarNumeroInvalido() {

            limparDadosCandidato();

            esconderFoto();


            definirMensagem(
                "✕ NÚMERO INVÁLIDO",
                "invalido"
            );


            setTimeout(
                () => {

                    limparTodosInputs();

                },
                1000
            );

        }


        // =====================================================
        // LIMPAR
        // =====================================================

        function limparTodosInputs() {

            if (
                votacaoFinalizada
            ) {

                return;

            }


            const inputs =
                elementoNumero.querySelectorAll(
                    ".numero-input"
                );


            inputs.forEach(
                input => {

                    input.textContent = "";

                    input.dataset.valor = "";

                    input.classList.remove(
                        "bg-[#eaf6ee]"
                    );

                }
            );


            votoAtual = "";

            votoConfirmado = false;


            limparDadosCandidato();

            esconderFoto();


            definirMensagem(
                "Digite o número"
            );

        }


        // =====================================================
        // LIMPAR DADOS
        // =====================================================

        function limparDadosCandidato() {

            nomeCandidato.innerText =
                "—";


            partidoCandidato.innerText =
                "—";

        }


        // =====================================================
        // MENSAGEM
        // =====================================================

        function definirMensagem(texto, tipo = "padrao") {

            elementoMensagem.innerText = texto;

            elementoMensagem.classList.remove(
                "bg-[#eaf6ee]",
                "bg-[#fde8e7]",
                "bg-[#fff1df]",
                "border-[#1b623a]/30",
                "border-[#1b623a]/40",
                "border-[#8d0801]/40",
                "border-[#d9660d]/40",
                "text-[#3f4f45]",
                "text-[#8d0801]",
                "text-[#1b623a]",
                "text-[#d9660d]"
            );

            if (tipo === "invalido") {

                elementoMensagem.classList.add(
                    "bg-[#fde8e7]",
                    "border-[#8d0801]/40",
                    "text-[#8d0801]"
                );

            } else if (tipo === "confirmado") {

                elementoMensagem.classList.add(
                    "bg-[#eaf6ee]",
                    "border-[#1b623a]/40",
                    "text-[#1b623a]"
                );

            } else if (tipo === "branco") {

                elementoMensagem.classList.add(
                    "bg-[#fff1df]",
                    "border-[#d9660d]/40",
                    "text-[#d9660d]"
                );

            } else {

                elementoMensagem.classList.add(
                    "bg-[#eaf6ee]",
                    "border-[#1b623a]/30",
                    "text-[#1b623a]"
                );
            }
        }


        // =====================================================
        // SOM DE CONFIRMAÇÃO
        // =====================================================

        function tocarSomConfirmacao() {

            somConfirmacao.currentTime = 0;

            somConfirmacao
                .play()
                .catch(() => {});

        }


        // =====================================================
        // SOM FINAL DA VOTAÇÃO
        // =====================================================

        function tocarSomFinal() {

            somFinal.currentTime = 0;

            somFinal
                .play()
                .catch(() => {});

        }


        // =====================================================
        // VOTO EM BRANCO
        // =====================================================

        function votarBranco() {

            if (
                votacaoFinalizada ||
                votoConfirmado
            ) {

                return;

            }


            votoConfirmado = true;


            limparDadosCandidato();

            esconderFoto();


            tocarSomConfirmacao();


            definirMensagem(
                "▢ VOTO EM BRANCO CONFIRMADO",
                "branco"
            );


            desabilitarInputs();


            setTimeout(
                () => {

                    proximoCargo();

                },
                1200
            );

        }


        // =====================================================
        // DESABILITAR
        // =====================================================

        function desabilitarInputs() {

            const inputs =
                elementoNumero.querySelectorAll(
                    ".numero-input"
                );


            inputs.forEach(
                input => {

                    input.classList.add(
                        "opacity-60"
                    );

                }
            );

        }


        // =====================================================
        // CONFIRMAR
        // =====================================================

        function confirmarVoto() {

            if (
                votacaoFinalizada ||
                votoConfirmado
            ) {

                return;

            }


            atualizarVoto();


            if (
                votoAtual.length !==
                getQuantidadeDigitos()
            ) {

                definirMensagem(
                    "Digite todos os números."
                );

                return;

            }


            const candidato =
                encontrarCandidato();


            if (!candidato) {

                definirMensagem(
                    "✕ NÚMERO INVÁLIDO",
                    "invalido"
                );

                return;

            }


            votoConfirmado = true;


            tocarSomConfirmacao();


            definirMensagem(
                "✓ VOTO CONFIRMADO",
                "confirmado"
            );


            desabilitarInputs();


            setTimeout(
                () => {

                    proximoCargo();

                },
                1200
            );

        }


        // =====================================================
        // PRÓXIMO CARGO
        // =====================================================

        function proximoCargo() {

            cargoAtual++;


            if (
                cargoAtual >=
                cargos.length
            ) {

                finalizarVotacao();

                return;

            }


            votoAtual = "";

            votoConfirmado = false;


            limparDadosCandidato();

            esconderFoto();


            elementoCargo.innerText =
                cargos[cargoAtual];


            elementoInstrucao.innerText =
                "Digite o número do candidato";


            definirMensagem(
                "Digite o número"
            );


            criarInputs();

        }


        // =====================================================
        // FINALIZAR
        // =====================================================

        function finalizarVotacao() {

            votacaoFinalizada = true;

            // Toca somente quando a votação termina
            tocarSomFinal();


            elementoCargo.innerText =
                "VOTAÇÃO ENCERRADA";


            elementoInstrucao.innerText =
                "Obrigado por votar";


            elementoNumero.innerHTML =
                "";


            limparDadosCandidato();

            esconderFoto();


            definirMensagem("");


            telaFinal.classList.remove(
                "hidden"
            );


            setTimeout(
                () => {

                    reiniciarVotacao();

                },
                5000
            );

        }


        // =====================================================
        // REINICIAR
        // =====================================================

        function reiniciarVotacao() {

            telaFinal.classList.add(
                "hidden"
            );


            cargoAtual = 0;

            votoAtual = "";

            votoConfirmado = false;

            votacaoFinalizada = false;


            elementoCargo.innerText =
                cargos[0];


            elementoInstrucao.innerText =
                "Digite o número do candidato";


            limparDadosCandidato();

            esconderFoto();


            definirMensagem(
                "Digite o número"
            );


            criarInputs();

        }


        // =====================================================
        // WEBSOCKET
        // =====================================================

        const protocolo =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";


        const socket =
            new WebSocket(
                `${protocolo}//${location.host}`
            );


        socket.addEventListener(
            "open",
            () => {

                console.log(
                    "Visor conectado ao servidor."
                );

            }
        );


        socket.addEventListener(
            "close",
            () => {

                console.log(
                    "Servidor desconectado."
                );

            }
        );


        socket.addEventListener(
            "error",
            erro => {

                console.log(
                    "Erro no WebSocket:",
                    erro
                );

            }
        );


        // =====================================================
        // RECEBER DO CELULAR
        // =====================================================

        socket.addEventListener(
            "message",
            event => {

                try {

                    const dados =
                        JSON.parse(
                            event.data
                        );


                    const comando =
                        dados.comando;


                    if (!comando) {

                        return;

                    }


                    if (
                        comando.tipo ===
                        "numero"
                    ) {

                        adicionarNumeroRemoto(
                            comando.valor
                        );

                    }


                    if (
                        comando.tipo === "acao" &&
                        comando.valor === "branco"
                    ) {

                        votarBranco();

                    }


                    if (
                        comando.tipo === "acao" &&
                        comando.valor === "corrige"
                    ) {

                        limparTodosInputs();

                    }


                    if (
                        comando.tipo === "acao" &&
                        comando.valor === "confirma"
                    ) {

                        confirmarVoto();

                    }

                } catch (erro) {

                    console.log(
                        "Comando inválido:",
                        erro
                    );

                }

            }
        );


        function preCarregarFotos() {

            const todasAsFotos = [
                ...chapa1,
                ...chapa2.candidatos
            ];

            todasAsFotos.forEach(candidato => {

                if (!candidato.foto) return;

                const imagem = new Image();

                imagem.src =
                    "../assets/images/" +
                    encodeURIComponent(candidato.foto);
            });
        }

        // =====================================================
        // INICIAR
        // =====================================================

        iniciarUrna();


        function iniciarUrna() {

            preCarregarFotos();

            cargoAtual = 0;

            votoAtual = "";

            votoConfirmado = false;

            votacaoFinalizada = false;


            elementoCargo.innerText =
                cargos[0];


            elementoInstrucao.innerText =
                "Digite o número do candidato";


            limparDadosCandidato();

            esconderFoto();


            definirMensagem(
                "Digite o número"
            );


            criarInputs();

        }

    </script>

</body>

</html>
