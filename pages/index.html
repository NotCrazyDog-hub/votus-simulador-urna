<!DOCTYPE html>

        html,
        body {

                inset: 0;

                justify-content: center;

                color: #1b623a;

                font-family: Inter, sans-serif;
                font-size: 20px;
                font-weight: 800;

                text-align: center;
                padding: 30px;

                    >


                    <img

                            select-none

                        alt=""
                    >

                </div>

            </div>

            <div

    </audio>

        <source

            type="audio/mpeg"
        >

    </audio>

    <script src="../assets/js/urna.js"></script>
